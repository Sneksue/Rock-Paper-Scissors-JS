<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rock paper scissors</title>
  </head>
  <body>
    <script>
      choice = ["rock", "paper", "scissors"];
      let humanScore = 0;
      let computerScore = 0;
      let rounds = 0;

      function getComputerChoice(choice) {
        const computerChoice = Math.floor(Math.random() * choice.length);
        return choice[computerChoice];
      }

      function getHumanChoice() {
        const humanChoice = prompt("rock, paper, or scissors?".toLowerCase());
        return humanChoice;
      }

      function playRounds() {
        const computerChoice = getComputerChoice(choice);
        const humanChoice = getHumanChoice();
        if (humanChoice === computerChoice) {
          rounds++;
          console.log(
            "Player: " +
              humanChoice +
              " " +
              "computer: " +
              computerChoice +
              " Tie round!",
          );
        } else if (
          (humanChoice === "rock" && computerChoice === "scissors") ||
          (humanChoice === "paper" && computerChoice === "rock") ||
          (humanChoice === "scissors" && computerChoice === "paper")
        ) {
          rounds++;
          humanScore++;
          console.log(
            "Player: " +
              humanChoice +
              " computer:" +
              computerChoice +
              " player wins round!",
          );
        } else {
          rounds++;
          computerScore++;
          console.log(
            "Player: " +
              humanChoice +
              " computer:" +
              computerChoice +
              " computer wins round!",
          );
        }
      }

      function playGame() {
        while (rounds < 5) {
          playRounds();
          console.log("Rounds", rounds);
        }
        if (rounds === 5) {
          scoreBoard(humanScore, computerScore);
        }
      }

      function scoreBoard(humanScore, computerScore) {
        if (humanScore > computerScore) {
          console.log("Player wins");
        } else if (computerScore > humanScore) {
          console.log("Computer Win!");
        } else {
          console.log("Tie Game!");
        }
      }

      playGame();
    </script>
  </body>
</html>
